# CI per ADR-0004. Windows may fail until NFR-004 `plan` is met.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Neovim for the NFR-007 test (scripts/nvim-check.lua).
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: Performance tests in release mode (NFR-001 to NFR-003)
        run: cargo test --release -p requimd-lsp -p requimd-checks nfr_00
      - name: requimd check on this repository
        run: cargo run --quiet -- check
      - name: requimd check on examples/shop
        run: cargo run --quiet --manifest-path ../../Cargo.toml -- check --strict
        working-directory: examples/shop
