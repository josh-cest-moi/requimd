# CI per ADR-0004. Linux, macOS and Windows are required (NFR-004 `plan`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Neovim for the NFR-007 test (scripts/nvim-check.lua).
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Before the tests, which run `requimd check` and would update an
      # outdated lock file (ADR-0007).
      - name: requimd check on this repository
        run: cargo run --quiet -- check --locked
      - name: requimd check on examples/shop
        run: cargo run --quiet --manifest-path ../../Cargo.toml -- check --strict --locked
        working-directory: examples/shop
      - run: cargo test --all
      - name: Performance tests in release mode (NFR-001 to NFR-003)
        run: cargo test --release -p requimd-lsp -p requimd-checks nfr_00

  # NFR-011: the VS Code extension in a real VS Code, pinned in
  # editors/vscode/src/test/run.ts. Linux only: the extension is the same on
  # every platform; the release smoke tests cover the binaries.
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/cache@v6
        with:
          path: editors/vscode/.vscode-test
          key: vscode-test-${{ hashFiles('editors/vscode/src/test/run.ts') }}
      - run: npm ci
      - run: xvfb-run -a npm test

  # FR-400: the site of this repository's specification, as a downloadable
  # artifact. Publishing to GitHub Pages comes later.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -- export site site
      - uses: actions/upload-artifact@v7
        with:
          name: requimd-site
          path: site
