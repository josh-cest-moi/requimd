# Release binaries (NFR-005: one file to install).
#
# - Push a tag such as v0.1.0 or v0.1.0-alpha.1 whose version matches
#   Cargo.toml: the binaries are attached to a GitHub release of that tag.
#   A tag with a suffix (`-alpha.1`, `-beta.2`, `-rc.1`) becomes a
#   pre-release.
# - Run the workflow by hand (Actions → Release → Run workflow): the binaries
#   are built and offered as downloads of the run; nothing is published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binary: runs on any Linux without libraries.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, smoke: true }
          - { os: macos-latest, target: aarch64-apple-darwin, smoke: true }
          # Cross-compiled on an Apple silicon runner; not run there.
          - { os: macos-latest, target: x86_64-apple-darwin, smoke: false }
          # Static C runtime: no Visual C++ redistributable needed.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, smoke: true, rustflags: "-C target-feature=+crt-static" }
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Version from Cargo.toml
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_ENV"
      - name: Tag matches the version
        if: github.ref_type == 'tag'
        run: |
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || { echo "tag ${GITHUB_REF_NAME} != v${VERSION} in Cargo.toml"; exit 1; }
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="requimd-v${VERSION}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/requimd"
          [ "${{ runner.os }}" = "Windows" ] && bin="$bin.exe"
          mkdir "$name"
          cp "$bin" README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
          echo "BIN=$bin" >> "$GITHUB_ENV"
      # The packaged binary runs on its own: init, check, export.
      - name: Smoke test
        if: matrix.smoke
        run: |
          dir=$(mktemp -d)
          exe="./$(basename "$BIN")"
          cp "$BIN" "$dir/"
          cd "$dir"
          "$exe" --version
          "$exe" init
          printf '## FR-001 A\n\nThe system shall work.\n' > a.md
          "$exe" check
          "$exe" export site site
          test -f site/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  # One job creates the release with all archives, so the text appears once.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release text
        run: |
          tag="${GITHUB_REF_NAME}"
          {
            echo "requimd ${tag}: requirements in Markdown, checked by a command line tool and supported by a language server."
            echo
            if [[ "$tag" == *-* ]]; then
              echo "> **Pre-release for testing.** Behaviour and file formats may still change before the next release."
              echo
            fi
            echo "Download the archive for your system, unpack it and put \`requimd\` (\`requimd.exe\` on Windows) on your \`PATH\`. Nothing else is needed."
            echo
            echo "| System | Archive |"
            echo "|--------|---------|"
            echo "| Linux x86_64 (static, any distribution) | \`requimd-${tag}-x86_64-unknown-linux-musl.tar.gz\` |"
            echo "| macOS, Apple silicon | \`requimd-${tag}-aarch64-apple-darwin.tar.gz\` |"
            echo "| macOS, Intel | \`requimd-${tag}-x86_64-apple-darwin.tar.gz\` |"
            echo "| Windows x86_64 | \`requimd-${tag}-x86_64-pc-windows-msvc.zip\` |"
            echo
            echo "Editor setup: [docs/neovim.md](https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/docs/neovim.md)."
          } > release-body.md
          ls dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-body.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
